<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plainfile</title>
<script>
  // Apply a saved light or dark choice before first paint, so there is no flash.
  try {
    var t = localStorage.getItem('plainfile-theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:1rem">Plainfile needs JavaScript to read your folder.</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
